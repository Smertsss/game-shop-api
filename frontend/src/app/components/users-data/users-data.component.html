<div class="games-container">
  <h1>Таблица Пользователей</h1>

  <div *ngIf="isLoading" class="loading">
    Loading games data...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <app-data-table
    *ngIf="!isLoading && !error"
    [data]="usersData"
    [columns]="columns">
  </app-data-table>
</div>
