<div class="games-container">
  <h1>Таблица Игр</h1>

  <div *ngIf="isLoading" class="loading">
    Loading games data...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <app-data-table
    *ngIf="!isLoading && !error"
    [data]="gamesData"
    [columns]="columns"
    [showActions]="true"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-data-table>
</div>
