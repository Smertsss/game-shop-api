<div class="games-container">
  <h1>Таблица Жанров</h1>

  <div *ngIf="isLoading" class="loading">
    Loading genres data...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <app-data-table
    *ngIf="!isLoading && !error"
    [data]="genresData"
    [columns]="columns"
    [showActions]="true"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-data-table>
</div>
