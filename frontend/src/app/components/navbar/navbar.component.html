<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-links">
      @if (currentUser?.roles?.includes('ADMIN')) {
      <a routerLink="/users-data" class="nav-link" routerLinkActive="active">Пользователи</a>
      <a routerLink="/games-data" class="nav-link" routerLinkActive="active">Игры</a>
      <a routerLink="/companies-data" class="nav-link" routerLinkActive="active">Компании</a>
      <a routerLink="/genres-data" class="nav-link" routerLinkActive="active">Жанры</a>
      } @else {
      <a routerLink="/main-games" class="nav-link" routerLinkActive="active">Игры</a>
      <a routerLink="/top-games" class="nav-link" routerLinkActive="active">Топ игр</a>
      <a routerLink="/new-game" class="nav-link" routerLinkActive="active">Новинки</a>
      <a routerLink="/update-games" class="nav-link" routerLinkActive="active">Обновления</a>
      <a routerLink="/free-games" class="nav-link" routerLinkActive="active">Бесплатные</a>
      }
    </div>

    <div class="navbar-actions">
      @if (authService.isAuthenticated()) {
      <button (click)="logout()" class="logout-button">Выход</button>
      } @else {
      <button routerLink="/login" class="logout-button">Вход</button>
      }
    </div>
  </div>
</nav>
