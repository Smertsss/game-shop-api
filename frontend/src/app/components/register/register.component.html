<div class="register-container">
  <button class="back-button" (click)="goBack()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>

  <div class="register-card">
    <h2>СОЗДАТЬ УЧЕТНУЮ ЗАПИСЬ</h2>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()" class="register-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Имя *</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            [(ngModel)]="userData.firstName"
            required
            placeholder="Введите имя"
          >
        </div>

        <div class="form-group">
          <label for="secondName">Фамилия *</label>
          <input
            type="text"
            id="secondName"
            name="secondName"
            [(ngModel)]="userData.secondName"
            required
            placeholder="Введите фамилию"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="username">Имя пользователя / никнейм *</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="userData.username"
          required
          placeholder="Введите имя пользователя"
        >
      </div>

      <div class="form-group">
        <label for="email">Электронная почта *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="userData.email"
          required
          placeholder="Введите email"
        >
      </div>

      <div class="form-group">
        <label for="login">Логин *</label>
        <input
          type="text"
          id="login"
          name="login"
          [(ngModel)]="userData.login"
          required
          placeholder="Введите логин"
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Пароль *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="userData.password"
            required
            placeholder="Введите пароль"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Подтвердите пароль *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            placeholder="Повторите пароль"
          >
        </div>
      </div>

      <button
        type="submit"
        class="register-button"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'СОЗДАНИЕ...' : 'СОЗДАТЬ АККАУНТ' }}
      </button>
    </form>

    <div class="alternative-actions">
      <p>Уже есть учётная запись? <a (click)="navigateToLogin()">Войти</a></p>
    </div>

    <div class="privacy-link">
      <a href="/">Политика конфиденциальности</a>
    </div>
  </div>
</div>
