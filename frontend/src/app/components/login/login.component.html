<div class="login-container">
  <button class="back-button" (click)="goBack()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>

  <div class="login-card">
    <h2>ВОЙТИ В GAMESHOP</h2>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="username">Введите электронную почту или логин</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="credentials.username"
          required
          placeholder="Введите email"
        >
      </div>

      <div class="form-group">
        <label for="password">Введите пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          placeholder="Введите пароль"
        >
      </div>

      <button type="submit" class="login-button">ПРОДОЛЖИТЬ</button>
    </form>

    <div class="alternative-actions">
      <p>Еще нет учётной записи? <a (click)="navigateToRegister()">Создать учетную запись</a></p>
    </div>

    <div class="social-login">
      <p>Другие способы входа</p>
      <div class="social-buttons">
        <button class="social-button">ВКонтакте</button>
        <button class="social-button">Google</button>
      </div>
    </div>

    <div class="alternative-actions">
      <p><a href="/">Проблемы со входом?</a></p>
    </div>

    <div class="privacy-link">
      <a href="/">Политика конфиденциальности</a>
    </div>
  </div>
</div>
